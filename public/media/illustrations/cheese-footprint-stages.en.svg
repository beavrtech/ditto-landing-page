  <text x="84" y="271" font-size="17" font-weight="700" fill="#130e30">6</text>

  <text x="10" y="300" font-size="17" fill="#130e30">Transport</text>
  <rect x="10" y="308" width="41" height="30" fill="#ffe228"/>
  <text x="63" y="329" font-size="17" font-weight="700" fill="#130e30">4</text>

  <text x="10" y="358" font-size="17" fill="#130e30">Distribution and consumption</text>
  <rect x="10" y="366" width="10" height="30" fill="#130e30"/>
  <text x="32" y="387" font-size="17" font-weight="700" fill="#130e30">1</text>

  <text x="10" y="424" font-size="14" fill="#130e30" opacity="0.6">Source: Impact CO2 (ADEME), Agribalyse 3.2</text>
</svg>
