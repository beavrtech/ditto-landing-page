<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 434" width="900" height="434" role="img" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="434" fill="#ffffff"/>
  <rect x="10" y="0" width="64" height="12" fill="#ffe228"/>
  <text x="10" y="54" font-size="34" font-weight="700" fill="#130e30">Mostly milk</text>
  <text x="10" y="86" font-size="19" fill="#130e30" opacity="0.7">French hard cheese, % of the 6.28 kg of CO2e emitted per kg</text>

  <text x="10" y="126" font-size="17" fill="#130e30">Farming (mostly milk)</text>
  <rect x="10" y="134" width="860" height="30" fill="#130e30"/>
  <text x="856" y="155" font-size="17" font-weight="700" fill="#ffffff" text-anchor="end">83%</text>

  <text x="10" y="184" font-size="17" fill="#130e30">Packaging</text>
  <rect x="10" y="192" width="73" height="30" fill="#130e30"/>
  <text x="95" y="213" font-size="17" font-weight="700" fill="#130e30">7</text>

  <text x="10" y="242" font-size="17" fill="#130e30">Processing</text>
